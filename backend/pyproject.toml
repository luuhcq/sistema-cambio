[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "S101",  # assert statements (used in tests)
    "S311",  # random module (not used for crypto here)
    "DJ001", # avoid nullable CharField (legacy schema)
    "DJ012", # model method ordering (project uses save-before-__str__ intentionally)
    "N806",  # User = get_user_model() is a Django convention
    "S112",  # try-except-continue acceptable in external API polling (ptax)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "N806"]
"*/tests*" = ["S101", "S105", "S106"]
"manage.py" = ["S603", "S607"]
